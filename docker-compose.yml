services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: careflow
      POSTGRES_PASSWORD: careflow
      POSTGRES_DB: careflow
    ports:
      - "5433:5432"  # host 5433 -- 5432 is already taken by an unrelated project on this machine
    volumes:
      - careflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://careflow:careflow@db:5432/careflow
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      CAREFLOW_MODEL: ${CAREFLOW_MODEL:-openai/gpt-oss-20b}
      JWT_SECRET: ${JWT_SECRET:-}
      CAREFLOW_ENV: ${CAREFLOW_ENV:-development}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Bind mount (not a named volume) so the Chroma vector store is the same directory
      # whether the app runs in Docker or locally via venv -- these must never diverge,
      # since document metadata lives in Postgres (shared) but vectors live here.
      - ./data:/app/data

volumes:
  careflow_pgdata:
